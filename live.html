<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentazione & Sondaggio Live · Conexa 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canva-container {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }
    #canva-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #toggle-poll-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: #111827;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #conexa-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(6px);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #conexa-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    #conexa-frame {
      width: 92%;
      height: 88%;
      max-width: 1200px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="canva-container">
    <iframe src="https://www.canva.com/design/DAHaIjSgrNQ/AHDUds4GADcINHOyA8huOQ/view?embed" allowfullscreen></iframe>
  </div>

  <div id="conexa-overlay">
    <iframe id="conexa-frame" src="./index.html"></iframe>
  </div>

  <button id="toggle-poll-btn" onclick="togglePoll()">
    <span>◈</span> <span id="btn-text">Sondaggio Live</span>
  </button>

  <script>
    const overlay = document.getElementById('conexa-overlay');
    const btnText = document.getElementById('btn-text');
    function togglePoll() {
      const isOpen = overlay.classList.toggle('active');
      btnText.textContent = isOpen ? 'Torna alle Slide' : 'Sondaggio Live';
    }
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 's' && document.activeElement.tagName !== 'INPUT') {
        togglePoll();
      }
    });
  </script>

</body>
</html>
